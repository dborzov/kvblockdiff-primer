# Advisory patterns of poor technical prose (docs/style/writing.md §3). `npm run check:tropes [paths…]`
# reports them; it never fails a build. Each entry: match (a JS regex, case-insensitive), say (the trope).
- match: "\\b(what|how much|that)\\s+(\\S+\\s+){0,4}(buys?|bought|purchases?|purchased)\\b|\\bbuys\\b"
  say: "trope 2, the purchasing metaphor: write the actual relation with its numbers"
- match: "\\b(foots? the bill|on the bill|pays? for (itself|themselves)|earns? (its|their) keep|charges? a tax|the room'?s rent|pay(s|ing)? in bits|the price of a)\\b"
  say: "trope 2, billing language: state the relation in bits, bytes or dollars (the defined terms *the bill* and *per-cherry tax* are the only allowed uses)"
- match: "\\b(prices|priced|is the price of)\\b"
  say: "trope 2, the purchasing metaphor (unless the literal price per GPU-hour is meant)"
- match: "\\b(in one sentence|in a sentence|in short|put simply|simply put|to put it (simply|briefly)|the short version)\\b"
  say: "trope 4, the one-sentence summary: name the argument as a term instead"
- match: "\\b(stand out|stands out)\\b"
  say: "trope 6, counting the things: list them"
- match: "\\b(two|three|four|five|six|seven)\\s+(things|facts|lessons|points|reasons|ideas|consequences|observations|rules)\\s+(stand out|follow|emerge|matter|deserve)"
  say: "trope 6, counting the things: list them"
- match: "\\b(one|two|three|four)\\s+\\w+,\\s+(one|two|three|four)\\s+\\w+\\b(?=[.:;]|\\s*$)"
  say: "trope 1, the catchphrase of counted things (check: a title or sentence of the form 'one X, two Y')"
- match: "\\bhonest(ly)?\\b"
  say: "trope 10, moralised precision: say what was measured, its grade, and what was assumed"
- match: "\\bcalibrated language\\b"
  say: "trope 10, moralised precision"
- match: "\\b(playbook|audit|battle-tested|north star|game-changer|low-hanging fruit|move the needle|double down|leverage(d|s)?\\b(?! ratio))\\b"
  say: "trope 9, consultancy vocabulary: use the plain technical word"
- match: "\\b(beats|wins over|trumps)\\b\\s+\\w+\\.$"
  say: "trope 5, an MBA-slide slogan? state the specific fact with its numbers"
- match: "^#{2,3}\\s+(what|why|how)\\s+(it|the \\w+|this|that)\\s+(says|holds|means|matters|works|buys)\\s*(\\{#[\\w-]+\\})?\\s*$"
  say: "trope 8, a heading that names a rhetorical move: name the content"
- match: "\\b(it is worth noting|it's worth noting|notably|importantly|crucially|interestingly)\\b"
  say: "filler that announces importance instead of stating the fact"
- match: "\\bnot (a|an|the|about)?\\s*\\w+(\\s+\\w+)?,\\s+but\\s+(a|an|the|about)?\\s*\\w+"
  say: "trope 11, the 'not X, but Y' frame (allowed only where the contrast arises in context)"
- match: "\\bthe answer is\\b"
  say: "trope 3, arguing with no one? check whether the question was asked"
