# The Parts of the site, in reading order (= dependency order). Each Part is a folder in content/ ("dir").
# Pages inside a folder are ordered by their numeric file prefix: 03-entropy.md is page 3.
# "figs" names the figure files (figures/<name>.js) loaded on every page of the Part.
# The page plan with every page id and scope: docs/project/page-plan.md.
- id: I
  dir: 01-tiny-files
  slug: tiny-files
  title: The tiny-file problem
  short: Tiny files
  emblem: braces
  figs: [tiny]
  lede: >
    A story everyone has met: small, similar records that refuse to compress one at a time.
    It contains the whole idea of this project in a setting with no machine learning at all.

- id: II
  dir: 02-school
  slug: school
  title: Back to school
  short: Back to school
  emblem: quill
  figs: [school-info, school-vectors]
  lede: >
    A gentle, self-contained primer on every idea the rest of the site leans on: bits and entropy,
    side information, entropy coders, prediction and residuals, vectors and furrows, codebooks,
    number formats, caches and wires. Toy examples only; no language models yet.

- id: III
  dir: 03-landscape
  slug: landscape
  title: How an LLM reads its memory
  short: How an LLM reads
  emblem: eye
  figs: [landscape]
  lede: >
    Attention, written out in Python with every shape named; the orchard of keys and values a sequence
    grows; the indexer and its picks; HiSparse's hot cache; and the two frozen reference settings every
    number on this site is quoted for.

- id: IV
  dir: 04-scenario
  slug: scenario
  title: The compression scenario
  short: The scenario
  emblem: envelope
  figs: [scenario, plan, measured]
  lede: >
    The standalone problem this project studies: a receiver asks for one cherry at a time, a sender
    answers with a delta, a dictionary is shared in advance. Stretch, slice, cherry, punnet, the contract,
    the score and the leash, each pinned down in Python before any compressor is built.

- id: V
  dir: 05-toolbox
  slug: toolbox
  title: The compressor's toolbox
  short: The toolbox
  emblem: gear
  figs: [homework-a, missed-a, missed-b, plan, measured]
  lede: >
    One page per kind of stage a compressor can be built from, each with a worked example, pseudocode,
    its bill, and what the campaigns found with it.

- id: VI
  dir: 06-application
  slug: app
  title: "kvblockdiff: the application"
  short: The application
  emblem: delta
  figs: [idea, homework-b, range, missed-b]
  lede: >
    What the scenario's numbers mean on a serving system: picks served as deltas, a shelf of
    dictionaries on the GPU, stretches on fire, and the chain from bytes on the link to dollars.

- id: VII
  dir: 07-hypotheses
  slug: hypotheses
  title: Hypotheses about the orchard
  short: Hypotheses
  emblem: apple
  figs: [idea, missed-a, missed-b]
  lede: >
    Every property of the orchard the project has bet on, stated in bits, with the way a scenario
    measures it and the verdict so far.

- id: VIII
  dir: 08-measured
  slug: measured
  title: The measurements
  short: The measurements
  emblem: roofline
  figs: [measured, range]
  lede: >
    What two autonomous research campaigns measured when the scenario was run through a harness on
    real Qwen3.5-2B orchards: what held, what broke, and what the bytes turned out to be made of.

- id: IX
  dir: 09-papers
  slug: papers
  title: Papers
  short: Papers
  emblem: scroll
  figs: [papers-a, papers-b]
  lede: >
    One page per paper worth our attention: its idea by example, what it assumes, what it shows,
    and what it says about our scenario, all in this site's words.

- id: X
  dir: 10-plan
  slug: plan
  title: The research plan
  short: The plan
  emblem: map
  figs: [plan]
  lede: >
    What is answered, what is open, and the next experiments in order of how fast they return a
    result: more scenarios in the harness, queries and a stand-in indexer for the dataset we have,
    and a replay of the hot cache.

- id: XI
  dir: 11-reference
  slug: reference
  title: Summary and reference
  short: Reference
  emblem: book
  figs: []
  lede: >
    The one-page summary, the glossary, the notation and its colours, the running themes,
    the grounded numbers with their sources, and the old words next to the new ones.
