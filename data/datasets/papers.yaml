# Running example datasets of Part V (papers). Fields: title, blurb (one sentence), emblem
# (theme/layouts/partials/emblems.njk), unit and source (short chips), story (optional, longer, reference page only),
# csv (download file name). The data, views and metrics: figures/datasets/<id>.js.
papers-kivi:
  title: KIVI's toy cache
  blurb: Keys and values of one head, 12 tokens × 8 channels, made up to have the shape the KIVI paper reports — two big key channels, and loud value tokens.
  emblem: gauge
  unit: 12 tokens × 8 channels × 2
  source: illustrative, fixed numbers
  csv: kivi-toy-cache.csv
  story: >-
    Two hand-made tables of the kind KIVI shows for real models: in the keys, channels c2 and c5 sit near +11 and −9 token
    after token; in the values no channel stands out, but tokens t3 and t8 are loud everywhere. They teach which numbers
    should share one rounding ruler (V.7), and what a lossless coder would want to know that KIVI does not report.
papers-temp-recipes:
  title: Temperatures, the papers' way
  blurb: The four weeks of Gull Rock temperatures coded with two recipes from Part V — CacheGen's anchors and differences, and KVComp's coarse grid.
  emblem: telegraph
  unit: 1,344 readings
  source: derived from Gull Rock temperatures
  csv: gull-rock-temperatures-recipes.csv
  story: >-
    The readings and previous-value residuals of II.10–II.12, regrouped. Cut into groups of ten with the first as anchor,
    they show what CacheGen's "differences are smaller than values" is worth on one channel with a slow daily drift (V.11).
    Rounded to whole degrees, they show that a predictor saves fewer bits but a larger share on a coarse grid (V.12).
papers-rope:
  title: One pair of key channels, turned by RoPE
  blurb: Pair 4 of a 128-wide key head over 64 tokens from position 1000 — a channel steady near 9 before RoPE, and the same numbers spun around a circle after it.
  emblem: compass
  unit: 64 tokens × 2 channels
  source: synthetic, seeded
  csv: rope-pair.csv
  story: >-
    A steady key channel (9 plus a little noise) and its quiet partner (0.6), turned by RoPE at 0.56 radians per token.
    Drawn as points in the plane of the pair, the tight spot before RoPE is smeared around a circle of radius 9 after it:
    lengths kept, directions spun. It is why KVQuant rounds keys before RoPE (V.8), and why a lossless coder would store
    them that way.
