# The glossary. One entry per term. In Markdown:  [[id]] mention · [[id|other words]] · [[=id]] the definition.
# Fields: label (chip text) · name (full name) · cat (category) · home (page id where it is DEFINED, once)
#         short (the hover reminder: one or two plain sentences, may use $math$ with \v… symbol macros)
#         ref (optional template with {key} placeholders over data/settings.yaml, shown per reference setting)
#         brand: true + nick + emblem + color [light, dark] for the signature terms (they get a badge).
# The rule behind the words: docs/style/terminology.md. Homes follow docs/project/page-plan.md.
# Writers: add NEW terms in data/terms/<part-slug>.yaml, never here, and never define an id twice.

# =============================================================== the cast: brand terms
dictionary:
  label: dictionary
  name: dictionary (side information shared by a punnet)
  brand: true
  nick: the Almanac
  emblem: book
  color: ["#94650a", "#f2c45a"]
  cat: project
  home: tiny-files-trained-dictionary
  short: >-
    Bytes shared by many cherries and held by the receiver before it asks for any of them, so that each cherry can be sent as a short delta. A zstd trained dictionary, a codebook, furrow statistics and a set of reference cherries are all dictionaries. Not a Python dict.

delta:
  label: delta
  name: delta δ (what is sent for one cherry once the dictionary is known)
  brand: true
  nick: the Remainder
  emblem: delta
  color: ["#b3264f", "#ff7aa0"]
  cat: project
  home: tiny-files-trained-dictionary
  short: >-
    The bytes sent for one cherry; with the dictionary they rebuild it bit for bit. Its size over the cherry's raw size is the delta share, $\vrho$.

kvblockdiff:
  label: kvblockdiff
  name: kvblockdiff (this project's proposal)
  brand: true
  nick: the Delta Store
  emblem: delta
  color: ["#b8441a", "#ff9a63"]
  cat: project
  home: app-mapping
  short: >-
    Serve the indexer's picks as deltas against punnet dictionaries kept on the GPU, so that a hot-cache miss moves a delta instead of a raw pick and the GPU rebuilds it bit for bit. One spelling, no hyphen.

orchard:
  label: orchard
  name: the orchard (all keys and values one sequence has grown)
  brand: true
  nick: the Orchard
  emblem: tree
  color: ["#3f6b2a", "#9fd47a"]
  cat: llm
  home: landscape-orchard
  ref: "{L} tokens × {NL} KV layers × {heads} heads × {headdim} elements, for keys and again for values"
  short: >-
    Every key and every value of one sequence at every KV layer, kept in host memory: two arrays `k`, `v` of shape `(n_tokens, n_kv_layers, n_kv_heads, head_dim)`. It grows one row per token and is never pruned. A store, not a cache; the thing usually called the "KV cache".

furrow:
  label: furrow
  name: furrow (one element position followed along the token axis)
  brand: true
  nick: the Furrow
  emblem: furrow
  color: ["#6b5a1e", "#d9c25e"]
  cat: linalg
  home: school-vectors
  short: >-
    One fixed `elem_id`, read across many vectors: `v[:, layer_id, head_id, elem_id]` in the orchard, one sensor's column in a table of readings. Per-furrow statistics are a location and a scale for each element position.

pick:
  label: pick
  name: pick (one unit of demand, as the indexer names it)
  brand: true
  nick: the Pick
  emblem: target
  color: ["#7a3a1a", "#efa27a"]
  cat: llm
  home: landscape-sparse-attention
  ref: "{k} picks per layer per decode step"
  short: >-
    One `(layer_id, token_pos_id)` the indexer selects at one decode step: the unit the hot cache holds and a miss fetches. What a pick covers depends on the LLM (one layer in DSA, a group of layers in GLM-5.1). A pick is served with one or more cherries.

stretch:
  label: stretch
  name: stretch (a run of consecutive token positions)
  brand: true
  nick: the Stretch
  emblem: ruler
  color: ["#8a6612", "#ecc75e"]
  cat: project
  home: scenario-stretch
  ref: "{b} tokens per stretch in the examples"
  short: >-
    `stretch_len` consecutive token positions of one sequence; `stretch_id = token_pos_id // stretch_len`. A knob we choose, not a fact of the data, and it says nothing about which tensor coordinates are in play.

slice:
  label: slice
  name: slice (which coordinates of the orchard are in play)
  brand: true
  nick: the Slice
  emblem: axes
  color: ["#2a63b8", "#82b3ff"]
  cat: project
  home: scenario-slice
  short: >-
    The rule naming which part of the orchard a scenario compresses: keys or values or both, which layers, which heads, which elements; written as the Python slice it is, e.g. `v[:, [1, 3], 0, :]`.

cherry:
  label: cherry
  name: cherry (one unit of ask-and-answer)
  brand: true
  nick: the Cherry
  emblem: cherry
  color: ["#b4212e", "#ff6b7a"]
  cat: project
  home: scenario-cherry
  ref: "{e} per cherry when a cherry is one token's values at one layer"
  short: >-
    The unit the receiver asks for and the sender answers with one delta: a fixed-shape sub-array of the slice, e.g. `cherry.shape == (2, 256)`, `cherry_bytes == 512`. Every cherry of a scenario has the same shape, known to both sides in advance.

punnet:
  label: punnet
  name: punnet (all the cherries one dictionary serves)
  brand: true
  nick: the Punnet
  emblem: basket
  color: ["#8b3a7a", "#e392d2"]
  cat: project
  home: scenario-punnet
  short: >-
    All cherries of one stretch under one slice and one cherry shape: what one `compress` call sees and what one dictionary serves. `punnet_size` cherries. Not an orchard and not a stretch.

leash:
  label: leash
  name: the leash (the cap on dictionary bytes one cold decode may touch)
  brand: true
  nick: the Leash
  emblem: leash
  color: ["#c0392b", "#ff8a7a"]
  cat: project
  home: scenario-the-leash
  short: >-
    Rebuilding any one cherry from cold may read at most `leash × cherry_bytes` distinct bytes of the dictionary: 137 cherries' worth in the baseline scenario (293 and 1103 in variants). It keeps "compress the whole punnet as one stream" out of the game.

compressor:
  label: compressor
  name: compressor (one concrete compress/decompress pair)
  brand: true
  nick: the Press
  emblem: gear
  color: ["#4d5f86", "#a9bbe6"]
  cat: coding
  home: scenario-compressors-and-stages
  short: >-
    One concrete pair of functions, `deltas, dictionary = compress(punnet)` and `decompress(delta, dictionary)`, built as a dataflow graph of stages. The campaigns wrote 126 of them.

hot-cache:
  label: hot cache
  name: hot cache (HiSparse's per-layer GPU buffer)
  brand: true
  nick: the Hearth
  emblem: flame
  color: ["#c2550a", "#ffa24d"]
  cat: systems
  home: landscape-hisparse
  ref: "2048 / 4096 / 8192 slots of {e} per layer in the examples"
  short: >-
    HiSparse's small buffer of $\vB$ raw picks per sequence per layer, kept in GPU memory and managed least-recently-used. Picks found there are hits; the rest are misses fetched from host memory over the link.

dictionary-shelf:
  label: dictionary shelf
  name: dictionary shelf (kvblockdiff's resident dictionaries)
  brand: true
  nick: the Bookshelf
  emblem: shelf
  color: ["#6a4a9a", "#c0a4f2"]
  cat: project
  home: app-shelf-and-two-misses
  short: >-
    kvblockdiff's per-layer set of $\vnD$ punnet dictionaries kept in GPU memory, one per stretch that is on fire. A miss in a stretch whose dictionary is on the shelf can be served by a delta.

delta-miss:
  label: δ-miss
  name: δ-miss (a miss served by a delta)
  brand: true
  nick: the Feather
  emblem: dart
  color: ["#0f7f5f", "#5fe0b8"]
  cat: project
  home: app-shelf-and-two-misses
  short: >-
    A hot-cache miss whose stretch's dictionary is on the shelf, so only the delta ($\vrho\,\ve$ bytes) crosses the link and the GPU rebuilds the pick.

raw-miss:
  label: raw miss
  name: raw miss (a miss served by the raw pick)
  brand: true
  nick: the Crate
  emblem: crate
  color: ["#7a5636", "#d9b38a"]
  cat: project
  home: app-shelf-and-two-misses
  short: >-
    A hot-cache miss whose stretch's dictionary is not on the shelf, so the full raw pick ($\ve$ bytes) crosses the link, exactly as in HiSparse today.

heavy-stretch:
  label: heavy stretch
  name: heavy stretch
  brand: true
  nick: the Anvil
  emblem: weight
  color: ["#4a4a63", "#b8b8dc"]
  cat: project
  home: app-on-fire
  short: >-
    A stretch that holds many of the current step's picks. If picks pile into a few heavy stretches for many steps, keeping their dictionaries on the shelf is cheap.

victim-tier:
  label: victim tier
  name: victim tier (a GPU tier of evicted picks' deltas)
  brand: true
  nick: the Lifebuoy
  emblem: lifebuoy
  color: ["#c0392b", "#ff8a7a"]
  cat: project
  home: app-victim-tier
  short: >-
    A second GPU tier holding the deltas of picks just evicted from the hot cache. If one of them is picked again it is rebuilt on the GPU instead of being fetched over the link.

pin:
  label: the Pin
  name: the Pin (the deployment-side reference setting)
  brand: true
  nick: the Pin
  emblem: pin
  color: ["#3b6e8f", "#8fc6ea"]
  cat: project
  home: landscape-reference-settings
  ref: "{model} · {NL} KV layers · cherries of {e} · link {Wlink} · {Mhbm} of GPU memory for orchards"
  short: >-
    One of the two frozen rigs every estimate is quoted for: HiSparse's GLM-5.1 deployment at 8-bit storage: 78 sparse layers, 2048 picks per layer per step, 100K-token context, 640-byte cherries, 30 ms per token, a 50 GB/s link, 30 GB of GPU memory for orchards.

bench:
  label: the Bench
  name: the Bench (the campaigns' data-side reference setting)
  brand: true
  nick: the Bench
  emblem: flask
  color: ["#5f8a52", "#a5cf8f"]
  cat: project
  home: landscape-reference-settings
  ref: "{model} · {NL} KV layers · {heads} heads × {headdim} · {L}-token sequences · {gpu}"
  short: >-
    The second frozen rig: Qwen3.5-2B's six KV layers, 2 heads × 256, 512-byte cherries for one token's values at one layer, 225K-token coding-agent transcripts, FP8, on one RTX 5080 with a 50 GB/s link. No indexer ran on it, so picks, misses and step time are not measured there.

hisparse:
  label: HiSparse
  name: HiSparse (Xie et al., 2026)
  brand: true
  nick: the Two-tier Library
  emblem: layers
  color: ["#2d4fa0", "#8eaaf5"]
  cat: systems
  home: landscape-hisparse
  short: >-
    The serving system we build on. It keeps each sequence's orchard in host memory and a small least-recently-used hot cache of raw picks per layer on the GPU. The LLM's outputs are unchanged.

indexer:
  label: indexer
  name: indexer (the selector of sparse attention)
  brand: true
  nick: the Scout
  emblem: magnifier
  color: ["#7a3a1a", "#efa27a"]
  cat: llm
  home: landscape-sparse-attention
  short: >-
    A cheap scorer that, at every layer and every decode step, looks over all past positions and names the $\vk$ picks attention will read. Its picks are announced before any bytes of the orchard are touched.

lucky-louis:
  label: Lucky Louis property
  name: the Lucky Louis property of the indexer
  brand: true
  nick: the Gambler
  emblem: clover
  color: ["#1a8a4a", "#63d98f"]
  cat: project
  home: landscape-lucky-louis
  short: >-
    From one decode step to the next, the indexer re-picks mostly the same positions, so a cache that bets on last round's winners keeps winning. It is about WHICH picks are wanted, not about their bytes.

neighbour:
  label: neighbour similarity
  name: neighbour similarity (umbrella term)
  brand: true
  nick: the Neighbours
  emblem: houses
  color: ["#8a5a1c", "#e3ad6c"]
  cat: project
  home: hypotheses-neighbour-similarity
  short: >-
    The family of hypotheses that a cherry costs fewer bits to store exactly when a neighbouring cherry along some axis of the orchard is already known. Members: fallen-apple (token axis), upstairs (layer axis), stereo (head axis), echo (repeats).

fallen-apple:
  label: fallen-apple similarity
  name: fallen-apple similarity (token axis)
  brand: true
  nick: the Apple
  emblem: apple
  color: ["#c4281f", "#ff7466"]
  cat: project
  home: hypotheses-fallen-apple
  short: >-
    Hypothesis: a cherry is cheaper to store exactly given a cherry of the same layer a small token distance $\vgap$ away, and the closer the neighbour the cheaper. A curve over $\vgap$, not a threshold. Measured: weak, except in the middle layers.

upstairs:
  label: upstairs similarity
  name: upstairs similarity (layer axis)
  brand: true
  nick: the Staircase
  emblem: stairs
  color: ["#2a63b8", "#82b3ff"]
  cat: project
  home: hypotheses-upstairs
  short: >-
    Hypothesis: the cherry of the same token one layer up is partly predictable from the one below it. Measured: small, and by kind of layer rather than by adjacency.

stereo:
  label: stereo similarity
  name: stereo similarity (head axis)
  brand: true
  nick: the Stereo Pair
  emblem: stereo
  color: ["#0a7c78", "#45d3c6"]
  cat: project
  home: hypotheses-stereo
  short: >-
    The two KV heads of a layer at one token are two views of one vector: their elements have a cosine near zero, yet joining them into one cherry saves about 0.85 bit per element. The strongest structure the campaigns measured.

echo:
  label: echo similarity
  name: echo similarity (repeats of the same token)
  brand: true
  nick: the Echo
  emblem: echo
  color: ["#5a6b1c", "#c3d96a"]
  cat: project
  home: hypotheses-echo
  short: >-
    An earlier occurrence of the same token, however far away, predicts a cherry far better than its neighbours do. Reference trees live on echoes; in the data the axis that mattered was repetition, not distance.

cat-ladder:
  label: cat-thread ladder
  name: the cat-thread ladder (the intuitive argument)
  brand: true
  nick: the Ladder
  emblem: cat
  color: ["#7d4f9e", "#d0a6f0"]
  cat: project
  home: hypotheses-the-ladder
  short: >-
    The intuitive argument for the project: a cherry is less surprising against its own sequence than against everything, and least surprising against its own neighbourhood. Right in direction, leaky in its evidence, and harsh in its exchange rate.

solo:
  label: solo
  name: solo (compressors with an empty dictionary)
  brand: true
  nick: the Hermit
  emblem: lantern
  color: ["#4d5f86", "#a9bbe6"]
  cat: project
  home: scenario-compressors-and-stages
  short: >-
    Coding each cherry by itself with one fixed, context-free table (per-furrow histograms fit once on a calibration corpus). 0.778 on the Bench's values. The baseline every dictionary must beat.

loc:
  label: furrow statistics
  name: furrow statistics (the loc stage)
  brand: true
  nick: the Anchor
  emblem: anchor
  color: ["#0a7c78", "#45d3c6"]
  cat: project
  home: toolbox-furrow-statistics
  short: >-
    The lightest dictionary: for each furrow, a typical value (location) and a spread (scale). Predict each element by its furrow's location; store the exact difference. Weighs about two cherries, no per-cherry tax.

klt:
  label: KLT
  name: Karhunen–Loève transform (KLT)
  brand: true
  nick: the Compass
  emblem: compass
  color: ["#7a35a8", "#c79af2"]
  cat: linalg
  home: school-rotation
  short: >-
    The rotation of the axes that lines them up with the directions in which the data spreads most (the same thing as PCA). After it, the coordinates are uncorrelated and can be coded one by one with no loss of efficiency.

vq:
  label: VQ
  name: vector quantization (VQ)
  brand: true
  nick: the Hive
  emblem: hive
  color: ["#b87400", "#f6b73c"]
  cat: coding
  home: school-clusters
  short: >-
    Describe each vector by the index of the nearest of $\vC$ reference vectors (centroids) in a codebook. Losslessly, the index is a prediction and the exact residual is stored too; the index costs $\log_2 \vC$ bits per vector.

sib:
  label: sibling
  name: sibling prediction (the sib stage)
  brand: true
  nick: the Twin
  emblem: twins
  color: ["#cc3d5a", "#ff8aa0"]
  cat: project
  home: toolbox-reference-cherries
  short: >-
    Use another cherry of the same punnet (the nearest "sibling") as the prediction, plus a pointer to it. Cheap side information, but the residual is the difference of two noisy vectors, so its noise doubles. The reference tree is its grown-up form.

scope-global:
  label: global scope
  name: global scope (one dictionary for all sequences)
  brand: true
  nick: the Globe
  emblem: globe
  color: ["#22407e", "#8fb0f0"]
  cat: project
  home: scenario-scope
  short: >-
    A dictionary fit once, offline, on a calibration corpus and shared by every sequence. Free at serving time; captures only what all texts have in common.

scope-sequence:
  label: sequence scope
  name: sequence scope (one dictionary per sequence)
  brand: true
  nick: the Spool
  emblem: spool
  color: ["#8b3a7a", "#e392d2"]
  cat: project
  home: scenario-scope
  short: >-
    A dictionary fit on one sequence's own slice, loaded once when the sequence is admitted. Captures what is special about this conversation. The same as stretch scope with one stretch as long as the sequence.

scope-stretch:
  label: stretch scope
  name: stretch scope (one dictionary per punnet)
  brand: true
  nick: the Brick
  emblem: brick
  color: ["#b8502a", "#ff9a6e"]
  cat: project
  home: scenario-scope
  short: >-
    A dictionary per punnet, fit on the punnet itself. Fits the local neighbourhood best, but there are many of them per sequence and the ones in use must be on the GPU.

curve:
  label: compressibility curve
  name: the delta–dictionary compressibility curve
  brand: true
  nick: the Arch
  emblem: roofline
  color: ["#5a6b1c", "#c3d96a"]
  cat: project
  home: scenario-the-score
  short: >-
    For one compressor family at one stretch length, the points (dictionary share, delta share) it reaches as its settings vary. The lower envelope over all compressors is the roofline the data allows.

# =============================================================== information theory (Back to school)
bit:
  label: bit
  name: bit
  cat: info
  home: school-bits
  short: >-
    The answer to one yes/no question; the unit of information. With $n$ bits you can tell apart $2^n$ equally likely possibilities.

lossless:
  label: lossless
  name: lossless compression
  cat: coding
  home: tiny-files-notice-anything
  short: >-
    Compression after which the original is rebuilt exactly, bit for bit. The opposite, lossy compression, keeps only an approximation.

lossy:
  label: lossy
  name: lossy compression
  cat: coding
  home: tiny-files-notice-anything
  short: >-
    Compression that throws some detail away for good and rebuilds only an approximation (JPEG photos, 2-bit KV quantization). This project is lossless.

probability:
  label: probability
  name: probability p
  cat: info
  home: school-surprise
  short: >-
    How often an outcome happens in the long run, a number $\vp$ between 0 and 1. All outcomes' probabilities add up to 1 (their distribution).

distribution:
  label: distribution
  name: probability distribution
  cat: stats
  home: school-surprise
  short: >-
    The list of all possible outcomes together with their probabilities. A histogram of real data is an estimate of it.

surprisal:
  label: surprisal
  name: surprisal (self-information)
  cat: info
  home: school-surprise
  short: >-
    How surprising one outcome is, in bits, $-\log_2 \vp$. Rare outcomes carry many bits; certain outcomes carry none. An ideal code spends exactly this many bits on the outcome.

entropy:
  label: entropy
  name: entropy H
  cat: info
  home: school-entropy
  short: >-
    The average surprisal of a source, $\vH$, in bits per symbol: the fewest bits per symbol any lossless code can average.

order-0-entropy:
  label: order-0 entropy
  name: order-0 entropy (context-free entropy)
  cat: info
  home: school-entropy
  short: >-
    The entropy computed from symbol frequencies alone, ignoring any context such as the previous symbols. The best a code can do if it looks at each symbol in isolation.

perplexity:
  label: perplexity
  name: perplexity
  cat: info
  home: school-entropy
  short: >-
    $2^{\vH}$: entropy expressed as an "effective number of equally likely choices". Popular for language models; this site uses bits because bits × size = bytes on a link.

side-information:
  label: side information
  name: side information
  cat: info
  home: school-side-information
  short: >-
    Something the receiver already knows that is relevant to the message (an almanac, a dictionary). It makes the message cheaper to send, by exactly the mutual information.

conditional-entropy:
  label: conditional entropy
  name: conditional entropy H(X | Y)
  cat: info
  home: school-side-information
  short: >-
    The average number of bits still needed to describe $\vX$ when $\vY$ is already known. Never more than $\vH(\vX)$, on average.

mutual-information:
  label: mutual information
  name: mutual information I(X; Y)
  cat: info
  home: school-mutual-information
  short: >-
    How many bits knowing $\vY$ saves when describing $\vX$, $\vI(\vX;\vY) = \vH(\vX) - \vH(\vX \mid \vY)$. Also called redundancy or, loosely, similarity: all three are the same number of bits.

redundancy:
  label: redundancy
  name: redundancy
  cat: info
  home: school-mutual-information
  short: >-
    The bits a message spends on things the receiver could have predicted. Removing redundancy is what every compressor does.

cross-entropy:
  label: cross-entropy
  name: cross-entropy
  cat: info
  home: school-arithmetic
  short: >-
    The average bits per symbol you pay when you code data with a probability table that is not exactly the data's true distribution. Always at least the entropy; the gap is the price of a wrong table.

# =============================================================== coding & compression
code:
  label: code
  name: code and codeword
  cat: coding
  home: school-codes
  short: >-
    A rule that turns each symbol into a string of bits (its codeword) and back. A prefix code is one where no codeword starts another, so a stream of codewords can be read without separators.

huffman:
  label: Huffman code
  name: Huffman code
  cat: coding
  home: school-codes
  short: >-
    The best prefix code for known symbol probabilities, built by repeatedly merging the two rarest symbols. Codeword lengths are whole bits, close to each symbol's surprisal.

entropy-coder:
  label: entropy coder
  name: entropy coder
  cat: coding
  home: school-arithmetic
  short: >-
    Any stage that spends about $-\log_2 \vp$ bits on a symbol of probability $\vp$, so its average rate approaches the entropy. Huffman, arithmetic coding and rANS are entropy coders.

arithmetic-coding:
  label: arithmetic coding
  name: arithmetic coding
  cat: coding
  home: school-arithmetic
  short: >-
    An entropy coder that codes a whole message as one number in a shrinking interval, so symbols can cost fractions of a bit. Near-ideal, but sequential: you must decode from the start.

rans:
  label: rANS
  name: rANS (range asymmetric numeral systems)
  cat: coding
  home: school-arithmetic
  short: >-
    A modern entropy coder with arithmetic coding's near-ideal rates and much faster decoding. Like arithmetic coding, it keeps a running state, so a stream decodes front to back.

fixed-length-code:
  label: fixed-length code
  name: fixed-length code
  cat: coding
  home: school-fixed-length
  short: >-
    Every value gets the same number of bits, $\vn$. Wasteful compared with an entropy coder, but any value's position is known in advance, so decoding is trivially parallel and random access is free.

escape:
  label: escape
  name: escape (and the escape stream)
  cat: coding
  home: school-fixed-length
  short: >-
    A value too big for the fixed width is "escaped": marked, and stored separately in full. Rare escapes keep the common case short.

random-access:
  label: random access
  name: random access
  cat: coding
  home: school-fixed-length
  short: >-
    Being able to decode any single item on its own, without decoding what came before it. Stream compressors (zstd, arithmetic coding) give it up; fixed-length codes keep it. The leash is random access as a rule.

zstd:
  label: zstd
  name: Zstandard (zstd)
  cat: coding
  home: tiny-files-one-at-a-time
  short: >-
    A widely used general-purpose lossless compressor. It replaces repeated byte strings with short references to an earlier copy and entropy-codes the rest; it can be primed with a trained dictionary.

lz-match:
  label: LZ matching
  name: LZ matching (Lempel–Ziv)
  cat: coding
  home: tiny-files-one-at-a-time
  short: >-
    The trick at the heart of zip and zstd: when a string of bytes has appeared before, write "copy n bytes from k bytes back" instead of the bytes themselves.

trained-dictionary:
  label: trained dictionary
  name: trained dictionary (zstd)
  cat: coding
  home: tiny-files-trained-dictionary
  short: >-
    A zstd dictionary built from a sample of typical records and given to both sender and receiver in advance, so that even a single small record compresses as if the compressor had seen its siblings.

prediction:
  label: prediction
  name: prediction and predictor
  cat: coding
  home: school-prediction
  short: >-
    A guess $\vxhat$ of the next value made only from things the receiver also knows. The rule that makes the guess is the predictor.

residual:
  label: residual
  name: residual
  cat: coding
  home: school-prediction
  short: >-
    The exact difference between a value and its prediction, $\vr = \vx - \vxhat$. In lossless coding it is an integer and is stored exactly; good predictions give small residuals that cost few bits.

predictive-coding:
  label: predictive coding
  name: lossless predictive coding (DPCM)
  cat: coding
  home: school-prediction
  short: >-
    Predict each value from what is already known, store the exact integer residual, entropy-code the residual. Lossless audio (FLAC), lossless images (PNG filters) and this project all have this shape.

context-modeling:
  label: context modelling
  name: context modelling
  cat: coding
  home: toolbox-context-modelling
  short: >-
    Instead of subtracting a prediction, use it as context: pick the probability table for the value based on the prediction. It can never do worse than ignoring the prediction, but it is not fixed-length.

codebook:
  label: codebook
  name: codebook
  cat: coding
  home: school-clusters
  short: >-
    The list of $\vC$ reference vectors (centroids) used by vector quantization. On this site "codebook" means only this; the general word is dictionary.

centroid:
  label: centroid
  name: centroid
  cat: stats
  home: school-clusters
  short: >-
    The average point of a group of vectors; the representative stored in a codebook.

k-means:
  label: k-means
  name: k-means clustering
  cat: stats
  home: school-clusters
  short: >-
    The standard way to fit a codebook: alternately assign every vector to its nearest centroid and move each centroid to the average of its vectors, until nothing changes.

index-tax:
  label: index tax
  name: index tax (the cost of naming a centroid)
  cat: coding
  home: school-clusters
  short: >-
    The $\log_2 \vC$ bits per vector that vector quantization spends to say which centroid was used. A codebook helps only if it saves more bits than this.

product-quantization:
  label: product quantization
  name: product quantization (PQ)
  cat: coding
  home: school-vq-vs-klt
  short: >-
    Split each vector into $\vnsub$ pieces and give each piece its own small codebook. Much larger effective codebooks for the same storage; the same economics as plain VQ.

rate-distortion:
  label: rate–distortion
  name: rate–distortion theory
  cat: info
  home: school-vq-vs-klt
  short: >-
    The theory of the best trade-off between how many bits you spend and how much error you accept. For Gaussian data it gives hard bounds that tell us when a codebook cannot win.

transform-coding-gain:
  label: transform coding gain
  name: transform coding gain
  cat: coding
  home: school-coding-gain
  short: >-
    The bits saved per element by rotating data to its KLT axes before coding, $\tfrac12\log_2(\mathrm{AM}/\mathrm{GM})$ of the eigenvalues. Large only when a few directions hold most of the spread.

lifting:
  label: lifting
  name: lifting (integer-reversible transforms)
  cat: linalg
  home: school-coding-gain
  short: >-
    A way to split a rotation into a few integer "shear" steps, each exactly reversible, so a transform can be lossless on integers. Used in lossless JPEG 2000.

amortization:
  label: amortization
  name: amortization
  cat: coding
  home: school-amortization
  short: >-
    Spreading a one-time cost over everything that shares it. A dictionary of $\vw$ cherries' worth shared by $\vb$ cherries costs $8\vw/\vb$ bits per element.

# =============================================================== statistics
mean:
  label: mean
  name: mean μ
  cat: stats
  home: school-residual-shapes
  short: >-
    The average value, $\vmu$. Subtracting it is the simplest prediction of all.

variance:
  label: variance
  name: variance σ²
  cat: stats
  home: school-residual-shapes
  short: >-
    The average squared distance from the mean, $\vsigma^2$: how spread out values are. Its square root $\vsigma$ is the standard deviation.

standard-deviation:
  label: standard deviation
  name: standard deviation σ
  cat: stats
  home: school-residual-shapes
  short: >-
    The typical distance of a value from the mean, $\vsigma$. Halving it saves one bit per value for bell-shaped data.

gaussian:
  label: Gaussian
  name: Gaussian (normal) distribution
  cat: stats
  home: school-residual-shapes
  short: >-
    The bell curve. Sums of many small independent effects look Gaussian. For a given spread it is the most unpredictable shape, so it is the honest worst case.

laplace:
  label: Laplace
  name: Laplace distribution
  cat: stats
  home: school-residual-shapes
  short: >-
    A sharper, pointier cousin of the bell curve (two exponential tails) with scale $\vbeta$. Prediction residuals usually look like this, so compressors model them with it.

r-squared:
  label: R²
  name: R² (fraction of variance explained)
  cat: stats
  home: school-exchange-rate
  short: >-
    The share of a value's variance that a predictor accounts for, $\vRsq$ between 0 and 1. The residual keeps variance $(1-\vRsq)\vsigma^2$.

monte-carlo:
  label: Monte Carlo
  name: Monte Carlo simulation
  cat: stats
  home: school-residual-shapes
  short: >-
    Checking a claim by simulating many random samples on a computer and measuring, instead of (or as well as) deriving it with formulas.

histogram:
  label: histogram
  name: histogram
  cat: stats
  home: school-entropy
  short: >-
    A count of how often each value (or range of values) occurs in a sample; the measured estimate of a distribution.

covariance:
  label: covariance
  name: covariance and correlation
  cat: stats
  home: school-correlation
  short: >-
    How much two furrows move together. Correlation is covariance rescaled to −1 … +1. Correlated furrows can partly predict each other.

covariance-matrix:
  label: covariance matrix
  name: covariance matrix
  cat: linalg
  home: school-correlation
  short: >-
    The $\vd \times \vd$ table of covariances between every pair of furrows. Its eigenvectors are the KLT axes and its eigenvalues the spreads along them.

standardize:
  label: standardize
  name: standardizing a furrow
  cat: stats
  home: school-vectors
  short: >-
    Subtract a furrow's mean and divide by its standard deviation, so every furrow has mean 0 and spread 1 and furrows measured in different units can be compared.

# =============================================================== vectors & linear algebra
vector:
  label: vector
  name: vector
  cat: linalg
  home: school-vectors
  short: >-
    An ordered list of $\vd$ numbers, e.g. one weather reading (temperature, humidity, …) or one cherry. Each number is an element.

element:
  label: element
  name: element (one stored number, and its position `elem_id`)
  cat: linalg
  home: school-vectors
  short: >-
    One number inside a vector, and its position `elem_id` from 0 to $\vd - 1$. "Bits per element" counts bits per stored number. The same position across many vectors is a furrow.

rotation:
  label: rotation
  name: rotation (change of basis)
  cat: linalg
  home: school-rotation
  short: >-
    Describing the same points with a different set of perpendicular axes. Nothing about the data changes; only which numbers we write down.

eigenvalue:
  label: eigenvalue
  name: eigenvectors and eigenvalues
  cat: linalg
  home: school-rotation
  short: >-
    For a covariance matrix, the eigenvectors are the natural axes of the data cloud and the eigenvalue $\vlambda$ of each is the variance along it.

pca:
  label: PCA
  name: principal component analysis (PCA)
  cat: linalg
  home: school-rotation
  short: >-
    The statistics name for the KLT: rotate to the directions of greatest spread. Same mathematics, different tradition.

low-rank:
  label: low rank
  name: low rank
  cat: linalg
  home: school-coding-gain
  short: >-
    Data whose spread lives mostly in a few directions (a few large eigenvalues, the rest small). The sharper the drop, the more a KLT saves.

am-gm:
  label: AM/GM
  name: arithmetic mean over geometric mean
  cat: linalg
  home: school-coding-gain
  short: >-
    The ratio of the ordinary average of the eigenvalues to their geometric average. It is 1 when all are equal and grows when a few dominate; $\tfrac12\log_2$ of it is the transform coding gain.

# =============================================================== number formats
integer-grid:
  label: INT8
  name: INT8 with a scale (a uniform grid)
  cat: numbers
  home: school-integers-floats
  short: >-
    Store $x$ as the nearest integer to $x/\text{scale}$, between −127 and 127. Representable values are evenly spaced, so differences behave as in ordinary arithmetic.

floating-point:
  label: floating point
  name: floating point (sign, exponent, mantissa)
  cat: numbers
  home: school-integers-floats
  short: >-
    Numbers stored as sign × mantissa × 2^exponent. Spacing between neighbours grows with size, so relative precision is constant and the grid is logarithmic.

exponent:
  label: exponent
  name: exponent and mantissa
  cat: numbers
  home: school-integers-floats
  short: >-
    In a floating-point number, the exponent picks the power of two (the "binade") and the mantissa picks the position inside it. In the orchard the exponent is predictable and the low mantissa bits are close to noise.

bf16:
  label: BF16
  name: bfloat16 (BF16)
  cat: numbers
  home: school-integers-floats
  short: >-
    A 16-bit floating-point format with 8 exponent bits and 7 mantissa bits: the usual working format of LLMs.

fp8:
  label: FP8
  name: 8-bit floating point (E4M3, E5M2)
  cat: numbers
  home: school-fp8
  short: >-
    8-bit floats. E4M3 has 4 exponent and 3 mantissa bits (values up to 448), E5M2 has 5 and 2. Where orchard storage is heading.

quantization:
  label: quantization
  name: quantization (rounding to a grid)
  cat: numbers
  home: school-fp8
  short: >-
    Rounding numbers to the nearest point of a fixed grid of representable values. Done once, it defines the exact values our lossless compressor must reproduce.

index-space:
  label: index space
  name: index space (counting grid steps)
  cat: numbers
  home: school-fp8
  short: >-
    Number the representable values of a format in order, …, −1, 0, 1, …, and work with those integer indices. A residual of 1 then means "one grid step", however big the step is.

# =============================================================== memory, caches & hardware
cache:
  label: cache
  name: cache
  cat: systems
  home: school-caches
  short: >-
    A small, fast memory that keeps copies of some items from a big, slow one. An item found in it is a hit; otherwise a miss, and the item must be fetched. On this site the word stands alone only for real caches: the hot cache and the dictionary shelf. The orchard is not one.

hit-miss:
  label: hit / miss
  name: hit and miss
  cat: systems
  home: school-caches
  short: >-
    A hit is an ask served from the cache; a miss must fetch the item from slower memory. The miss rate $\vm$ is the fraction of asks that miss.

eviction:
  label: eviction
  name: eviction
  cat: systems
  home: school-caches
  short: >-
    Removing an item from a full cache to make room for a new one. The eviction policy decides which item goes.

lru:
  label: LRU
  name: least recently used (LRU)
  cat: systems
  home: school-caches
  short: >-
    The eviction policy that throws out the item whose last use was longest ago. Simple, and very good when recent use predicts future use.

reuse-distance:
  label: reuse distance
  name: reuse distance (stack distance)
  cat: systems
  home: school-reuse-distance
  short: >-
    For an ask, the number of distinct other items asked for since this item's previous ask. Under LRU with $\vB$ slots, an ask misses exactly when its reuse distance is at least $\vB$.

miss-rate-curve:
  label: miss-rate curve
  name: miss-rate curve m(B)
  cat: systems
  home: school-reuse-distance
  short: >-
    The miss rate of an LRU cache as a function of its size $\vB$. One curve, read off the reuse distances, gives the miss rate at every size.

belady:
  label: Bélády
  name: Bélády's optimal policy
  cat: systems
  home: school-reuse-distance
  short: >-
    The clairvoyant eviction policy: evict the item whose next use is furthest in the future. Impossible in practice, but it bounds what any policy could achieve.

bandwidth:
  label: bandwidth
  name: bandwidth and latency
  cat: systems
  home: school-wires
  short: >-
    Bandwidth is how many bytes per second a link carries once data flows; latency is how long one ask takes to start arriving. Many tiny scattered reads hurt both.

hbm:
  label: HBM
  name: HBM (GPU memory)
  cat: systems
  home: school-wires
  short: >-
    High-bandwidth memory stacked next to the GPU: very fast, small (tens of GB) and expensive. The hot cache lives here.

dram:
  label: host DRAM
  name: host memory (DRAM)
  cat: systems
  home: school-wires
  short: >-
    The CPU's main memory, much larger than HBM and much slower to reach from the GPU. HiSparse keeps every orchard here.

pcie:
  label: PCIe
  name: PCIe link
  cat: systems
  home: school-wires
  short: >-
    The wire between host memory and the GPU. PCIe Gen5 ×16 carries about 64 GB/s each way (≈50 in practice), roughly 100× less than HBM.

link:
  label: the link
  name: the link (host memory ↔ GPU)
  cat: systems
  home: landscape-memory-wall
  ref: "{Wlink} in both settings"
  short: >-
    The PCIe wire between the host memory that holds the orchards and the GPU; $\vWlink$ is its practical bandwidth. Every miss and every dictionary load crosses it. What the compression scenario calls "the channel" in textbooks is this wire.

# =============================================================== transformers & attention (Part III)
token:
  label: token
  name: token
  cat: llm
  home: landscape-tokens-and-decoding
  short: >-
    The unit of text an LLM reads and writes: a word or a piece of one. Its position in the sequence is `token_pos_id`. An LLM generates one token per decode step.

sequence:
  label: sequence
  name: sequence (one LLM context)
  cat: llm
  home: landscape-tokens-and-decoding
  ref: "{L} tokens in the examples"
  short: >-
    One conversation's tokens as the LLM sees them, from its first token to now; the thing that grows an orchard. A serving system runs many sequences at once. On this site the word never means "the order of cherries".

llm:
  label: LLM
  name: the LLM (always named)
  cat: llm
  home: landscape-tokens-and-decoding
  ref: "{model}"
  short: >-
    The language model whose orchard we study, always named: GLM-5.1 on the Pin, Qwen3.5-2B on the Bench. A stand-in LLM is one measured in place of the real target. Never "the model".

stand-in-llm:
  label: stand-in LLM
  name: stand-in LLM (a small open LLM measured in place of the target)
  cat: llm
  home: landscape-reference-settings
  short: >-
    A small open LLM whose orchard is measured in place of the real sparse-attention target: Qwen3.5-2B on the Bench. Whether its statistics transfer to GLM-5.1 is itself a risk.

prefill-decode:
  label: prefill / decode
  name: prefill and decode
  cat: llm
  home: landscape-tokens-and-decoding
  short: >-
    Prefill reads the whole prompt at once; decode then generates the answer one token per step, each step reading everything stored so far.

layer:
  label: layer
  name: layer
  cat: llm
  home: landscape-tokens-and-decoding
  ref: "{NL} KV layers"
  short: >-
    One of the stacked processing stages of a transformer, numbered by `layer_id`. Each layer has its own attention and, if it is a KV layer, its own rows of the orchard.

kv-layer:
  label: KV layer
  name: KV layer (a layer that keeps keys and values)
  cat: llm
  home: landscape-tokens-and-decoding
  ref: "{NL} of them"
  short: >-
    A layer that keeps keys and values for every token. In hybrid LLMs only some layers do: 6 of Qwen3.5-2B's 24; the others carry a fixed-size state and have nothing per token to store. The orchard's `layer_id` counts KV layers only.

hidden-state:
  label: hidden state
  name: hidden state
  cat: llm
  home: landscape-tokens-and-decoding
  short: >-
    The vector `x` a transformer carries for each token between layers; keys, values and queries are fixed linear projections of it.

tpot:
  label: TPOT
  name: time per output token (TPOT)
  cat: llm
  home: landscape-tokens-and-decoding
  ref: "{tpot}"
  short: >-
    How long one decode step takes for a sequence: 30 ms on the Pin. Every byte moved per step must fit into this time.

attention:
  label: attention
  name: attention (query, key, value)
  cat: llm
  home: landscape-attention
  short: >-
    The step where a token looks back. Its query vector is compared with every stored key; the scores become weights; the output is the weighted mix of the stored values.

query:
  label: query
  name: query
  cat: llm
  home: landscape-attention
  short: >-
    The vector `q` the current token uses to score every stored key at one layer; one per query head. Queries are not stored, which is why the dataset has none unless they are recomputed.

head:
  label: KV head
  name: KV head and GQA
  cat: llm
  home: landscape-attention
  ref: "{heads} KV heads of {headdim} elements per layer"
  short: >-
    Attention is split into several heads that work in parallel. With grouped-query attention (GQA) several query heads share one key/value head, `head_id`; only the KV heads are stored, which shrinks the orchard.

rope:
  label: RoPE
  name: rotary position embedding (RoPE)
  cat: llm
  home: landscape-rope-and-mla
  short: >-
    The way many LLMs tell attention where a token sits: by rotating pairs of key and query elements by an angle that grows with the position. Keys are more regular before this rotation than after it.

mla:
  label: MLA
  name: multi-head latent attention (MLA)
  cat: llm
  home: landscape-rope-and-mla
  short: >-
    DeepSeek's variant of attention that stores one compressed latent vector per token per layer instead of separate keys and values. Still one fixed-size row of the orchard per token per layer.

sparse-attention:
  label: sparse attention
  name: top-k sparse attention
  cat: llm
  home: landscape-sparse-attention
  short: >-
    Attention that reads only $\vk$ picks per layer per step (named by an indexer) instead of every stored token. Compute stops growing with context; storage does not.

dsa:
  label: DSA
  name: DeepSeek Sparse Attention (DSA)
  cat: llm
  home: landscape-sparse-attention
  short: >-
    The top-k sparse attention of DeepSeek-V3.2 (also used by GLM-5.x), with a small trained "lightning indexer" that scores every past token cheaply.

# =============================================================== the compression scenario (Part IV)
sender-receiver:
  label: sender / receiver
  name: sender and receiver
  cat: project
  home: scenario-one-cherry-at-a-time
  short: >-
    The two ends of the scenario: the sender holds the orchard in host memory and prepares dictionaries and deltas at leisure; the receiver on the GPU side asks for one cherry at a time and must rebuild it from its delta and the dictionary it already holds.

scenario:
  label: scenario
  name: scenario (one fully specified compression problem)
  cat: project
  home: scenario-one-cherry-at-a-time
  short: >-
    The tuple `(slice, cherry_shape, stretch_len, leash, fmt, llm, corpus)`. Written in prose as `V · layers 1,3 · head 0 · cherry (2, 256) · stretch 4096 · leash 137`. Two scenarios with the same slice and different cherry shapes are different problems.

cherry-shape:
  label: cherry shape
  name: cherry shape (how the slice is diced into cherries)
  cat: project
  home: scenario-cherry
  short: >-
    The dicing rule of a scenario: `cherry_shape == (256,)` makes one cherry per head vector, `(2, 256)` one per token across two layers or heads, `(6, 2, 256)` one per token across six layers. The other half, with the slice, of what used to be called an "entry split".

contract:
  label: the contract
  name: the contract (what makes a compression valid)
  cat: project
  home: scenario-the-contract
  short: >-
    `deltas, dictionary = compress(punnet)` once on the sender's side; then `decompress(deltas[i], dictionary) == punnet[i]` for every cherry `i`, bit for bit, decoded cold. Anything less is not a result.

cold-decode:
  label: cold decode
  name: cold decode
  cat: project
  home: scenario-the-contract
  short: >-
    Rebuilding one cherry from nothing but its own delta, the dictionary and the scenario's known constants, without having decoded any other cherry first. The way the harness checks every cherry and counts its reads.

mdl-ratio:
  label: MDL ratio
  name: MDL ratio
  cat: info
  home: scenario-the-score
  short: >-
    (dictionary bytes + all delta bytes) ÷ raw bytes of the punnet, so $\vxshare + \vrho$ in units of a raw cherry. 1.0 means no compression; 8 × the ratio is bits per element.

dictionary-share:
  label: dictionary share
  name: dictionary share x
  cat: info
  home: scenario-the-score
  short: >-
    The dictionary's bytes over the punnet's raw bytes, $\vxshare = \vw/\vb$. Bookkeeping, not a measure of shared information: a compressor may file reference cherries in the dictionary or in deltas and the ratio barely moves.

delta-share:
  label: delta share
  name: delta share ρ
  cat: info
  home: scenario-the-score
  short: >-
    The mean delta over a raw cherry, $\vrho$, averaged over every cherry of the punnet, empty deltas included. For 8-bit storage it is the bits per element of the deltas alone, divided by 8. The number a miss on the link cares about.

bpe:
  label: bits per element
  name: bits per element (bpe)
  cat: project
  home: scenario-the-score
  short: >-
    The rate of a lossless compressor per 8-bit element, everything included (residuals, per-cherry tax, the dictionary spread over its punnet). Raw storage is 8; bits per element = 8 × MDL ratio.

reads:
  label: reads
  name: reads (dictionary bytes one cold decode touched)
  cat: project
  home: scenario-the-leash
  short: >-
    The distinct dictionary bytes the decoder touched while rebuilding one cherry from cold, in cherries' worth; re-reads count once and the cherry's own delta is free. Must stay under the leash for every cherry, not on average.

scope:
  label: dictionary scope
  name: dictionary scope
  cat: project
  home: scenario-scope
  short: >-
    What a dictionary is fit on and shared by: global (all sequences), sequence (one conversation) or stretch (one punnet). The one axis that decides who pays for the dictionary.

weight:
  label: dictionary weight
  name: dictionary weight w
  cat: project
  home: scenario-scope
  short: >-
    A dictionary's size measured in cherries' worth, $\vw$, so it is $\vDsz = \vw\,\ve$ bytes. Spread over a punnet of $\vb$ cherries it costs $8\vw/\vb$ bits per element.

calibration-set:
  label: calibration corpus
  name: calibration corpus (data kept apart for the global scope)
  cat: project
  home: scenario-scope
  short: >-
    Sequences kept apart from the evaluation data. Every global-scope dictionary and every solo table is fit on them. If they overlap the evaluation data, the global scope cheats.

stage:
  label: stage
  name: stage (one node of a compressor's graph)
  cat: coding
  home: scenario-compressors-and-stages
  short: >-
    One step of a compressor's dataflow graph: a bit-field split, a predictor (furrow statistics, a reference cherry, a linear prediction, a basis, a codebook), the exact residual, a quantiser on the dictionary side, an entropy coder or a fixed-length code, the layout. Part V is the catalogue.

harness:
  label: harness
  name: the harness (the referee)
  cat: project
  home: scenario-the-harness
  short: >-
    The program every compressor runs through: it checks the contract for every cherry in a fresh process, counts every byte by one rule, measures reads against the leash, pairs scores on the same punnets and records every trial in a ledger no one may edit.

shuffle-control:
  label: shuffle control
  name: shuffle control
  cat: project
  home: scenario-the-harness
  short: >-
    Rerun the measurement after shuffling tokens across sequences. Any gain that depends on neighbours being neighbours must vanish; a gain that survives is a bug.

verified-result:
  label: verified
  name: verified result
  cat: project
  home: scenario-the-harness
  short: >-
    A score whose every cherry was rebuilt bit for bit by a separate decoder-only process from the stored bytes alone, with its reads counted. Anything else is a quick trial, a code-length estimate or a bound.

# =============================================================== the toolbox (Part V)
cherry-tax:
  label: per-cherry tax
  name: per-cherry tax (side information sent with every cherry)
  cat: project
  home: toolbox-the-bill
  short: >-
    Bits a stage must put into every delta on top of its residual: which centroid ($\log_2 \vC$ bits), which reference cherry ($\log_2 \vb$ bits), a flag. Spread over the cherry's $\vd$ elements it is the $\vtax$ of the bill.

bill:
  label: the bill
  name: the bill (rate = residual bits + per-cherry tax + dictionary share)
  cat: project
  home: toolbox-the-bill
  short: >-
    Every compressor's rate in bits per element has three lines: what the residuals cost, what each cherry carries besides its residual, and the dictionary's bytes spread over its punnet ($8\vw/\vb$). The harness charges all three, always.

reference-cherry:
  label: reference cherry
  name: reference cherry
  cat: coding
  home: toolbox-reference-cherries
  short: >-
    Another cherry of the same punnet, stored in the dictionary or already decodable, that a compressor uses as the prediction for a cherry; the delta then codes the exact difference. The sibling stage grown up.

reference-tree:
  label: reference tree
  name: reference tree
  cat: coding
  home: toolbox-reference-cherries
  short: >-
    The links from every cherry of a punnet to its reference cherry; the best compressors use the punnet's minimum spanning tree by distance, so each cherry hangs off its closest relative, usually an echo.

linear-prediction:
  label: linear prediction
  name: linear prediction across elements
  cat: coding
  home: toolbox-linear-prediction
  short: >-
    Guessing an element's value from elements already decoded in the same cherry, as a weighted sum; the table of which elements and which weights is stored once per punnet.

bit-field-split:
  label: bit-field split
  name: bit-field split (sign and exponent one way, mantissa another)
  cat: coding
  home: toolbox-bit-fields
  short: >-
    A stage that separates the bit fields of each FP8 element and routes them to different parts of the compressor's graph: the predictable sign and exponent to a predictor and entropy coder, the noisy mantissa to a cheaper path.

grid-aware-model:
  label: grid-aware table
  name: grid-aware probability table
  cat: coding
  home: toolbox-bit-fields
  short: >-
    A probability table that describes the value, not the code number: a Laplace bump in value units, centred on the prediction, whose probability for each 8-bit code is the area over that code's grid cell. Needed on E4M3, where a single bump in index space fits badly.

entropy-rate:
  label: entropy rate
  name: entropy rate (the scientific number)
  cat: project
  home: toolbox-two-rates
  short: >-
    The rate an ideal entropy coder would reach on the residuals, plus the per-cherry tax and the amortized dictionary. What arithmetic coding or rANS would achieve.

fixed-length-rate:
  label: fixed-length rate
  name: fixed-length rate (the engineering number)
  cat: project
  home: toolbox-two-rates
  short: >-
    The rate of a fixed-length code with escapes on the residuals, plus the per-cherry tax and the amortized dictionary. What a fast GPU decoder achieves, and directly the delta size on the link.

code-length-estimate:
  label: code-length estimate
  name: code-length estimate
  cat: info
  home: toolbox-bounds
  short: >-
    The code length a probability table would reach, computed exactly on the data without building the compressor; a lead, not a result. The campaigns' "exact model" numbers.

# =============================================================== the application (Part VI)
delta-miss-fraction:
  label: δ-miss fraction
  name: δ-miss fraction f_D
  cat: project
  home: app-shelf-and-two-misses
  short: >-
    $\vfD$, the share of misses that are δ-misses (their stretch's dictionary was on the shelf). Decided by the residency policy and by where misses land.

lever:
  label: lever
  name: the two levers (cheaper misses, cheaper slots)
  cat: project
  home: app-two-levers
  short: >-
    Lever 1 makes misses cheaper (move $\vrho\,\ve$ instead of $\ve$ over the link); lever 2 makes hot-cache slots cheaper (keep heavy stretches as deltas in GPU memory).

roofline:
  label: roofline
  name: roofline (of the compressibility curve)
  cat: project
  home: scenario-the-score
  short: >-
    The lower envelope of the compressibility curves of all compressors tried: the best trade-off between dictionary share and delta share that the data allows.

interesting-range:
  label: the interesting range
  name: the interesting range of dictionaries
  cat: project
  home: app-two-boring-corners
  short: >-
    Dictionaries large enough to carry a punnet's shared structure and too large to keep resident for every stretch: kept in host memory, brought to the GPU for the stretches the indexer keeps wanting.

on-fire:
  label: on fire
  name: an on-fire stretch
  cat: project
  home: app-on-fire
  short: >-
    A stretch whose popularity crossed the threshold, so its dictionary has been loaded onto the shelf and its misses travel as deltas; the opposite state is ice.

popularity:
  label: popularity
  name: stretch popularity
  cat: systems
  home: app-on-fire
  short: >-
    The running count of misses (or picks) a stretch has received over a window of recent decode steps; the statistic that decides which stretches are on fire.

decode-throughput:
  label: tokens per second
  name: decode throughput per GPU
  cat: systems
  home: app-bits-to-dollars
  short: >-
    Output tokens one GPU produces per second across all its concurrent sequences: the sequences it serves divided by the time per output token, $\vtps = \vN / \vtpot$. About 3,630 for HiSparse on the Pin.

cost-per-token:
  label: cost per million tokens
  name: cost per million output tokens
  cat: project
  home: app-bits-to-dollars
  short: >-
    The price of one GPU-hour divided by the tokens that hour produces, scaled to a million. The price is an assumption; the ratio between two designs is not.

# =============================================================== hypotheses (Part VII)
leak:
  label: the leak
  name: the leak (hit rate is about queries, not bytes)
  cat: project
  home: hypotheses-the-leak
  short: >-
    The flaw in the intuitive argument: HiSparse's high hit rates follow from slowly drifting queries and say nothing about whether the picks' bytes are alike. A Monte Carlo with i.i.d. keys reproduces the hit rates with zero compressibility.

trap:
  label: the trap
  name: the trap (the exchange rate is harsh)
  cat: project
  home: hypotheses-the-trap
  short: >-
    Explaining 75 % of a value's variance saves only one bit of eight; 94 % saves two. A lossless compressor is paid in variance explained at a harsh rate, and the noise floor is paid in full.

# =============================================================== the measurements (Part VIII)
campaign:
  label: campaign
  name: research campaign
  cat: project
  home: measured-dispatch
  short: >-
    One run of the autonomous research loop: several AI researcher agents writing and testing compressors against one harness, under one set of rules, with every trial recorded. C1 was the night of 29–30 October 2026; C2 the day of 30 October.

screen:
  label: screen
  name: screen
  cat: project
  home: measured-rules-of-the-game
  short: >-
    A fixed, cheap test: a tenth of the stretches of two (or five) sequences at one scenario. Two screens read different punnets, so their scores cannot be subtracted.

same-window:
  label: same-window comparison
  name: same-window comparison
  cat: stats
  home: measured-cutting-the-tensor
  short: >-
    Two compressors or two cherry shapes run on exactly the same elements; the only fair way to rank cherry shapes.

shared-table:
  label: shared table
  name: shared table
  cat: project
  home: measured-where-the-bits-come-from
  short: >-
    A large data structure specific to no sequence and no punnet, prepared in advance and held by both sides, trained on an independent dataset; legitimate by the human's ruling, used by no compressor yet.

paired-difference:
  label: paired difference
  name: paired difference
  cat: stats
  home: measured-signal-or-noise
  short: >-
    One compressor's score minus another's on exactly the same punnets, per sequence; its spread over sequences is the noise that matters.

punnet-redundancy:
  label: punnet redundancy
  name: punnet redundancy (shared information per element)
  cat: info
  home: measured-what-the-half-means
  short: >-
    The bits per element that the cherries of a punnet share: the sum of their solo entropies minus their joint entropy, per element. The most any per-punnet compressor can save over solo coding.

# =============================================================== papers (Part IX)
data-path:
  label: data path
  name: data path (where compressed orchard bytes travel, and how they are read)
  cat: systems
  home: papers-reading-guide
  short: >-
    Where a compressed orchard travels and how it is read back: a bulk transfer between machines, a network fetch of a stored prefix, the GPU-resident footprint, or the sparse-decode miss path of scattered single-cherry reads. The path, more than the statistics, decides what a compressor may look like.

disaggregation:
  label: disaggregated serving
  name: disaggregated serving (prefill and decode on separate GPUs)
  cat: systems
  home: papers-splitzip
  short: >-
    Running the prefill of a prompt and the decoding of its answer on different GPUs or machines. The finished orchard of the prompt must then be shipped from the prefill side to the decode side, in one bulk transfer per sequence.

slepian-wolf:
  label: Slepian–Wolf
  name: Slepian–Wolf coding (side information only at the decoder)
  cat: info
  home: papers-classics
  short: >-
    The 1973 theorem that $\vX$ can be sent losslessly at $\vH(\vX \mid \vY)$ bits even when only the receiver knows $\vY$: the sender groups messages into bins and the receiver uses $\vY$ to pick the right member. Its lossy sibling is Wyner–Ziv coding.

plus-factorization:
  label: PLUS factorization
  name: PLUS factorization (a rotation as integer-reversible steps)
  cat: linalg
  home: papers-classics
  short: >-
    Writing a matrix as a reordering of its rows (P) times three triangular factors (L, U, S) whose diagonals hold only ones when the matrix is a rotation. Each factor can be applied to integers with rounding and undone exactly: lifting for whole matrices.

scale-group:
  label: scale group
  name: scale group (numbers that share one rounding ruler)
  cat: numbers
  home: papers-kivi
  short: >-
    The set of numbers that are rounded with one shared ruler, one smallest value and one step size. Per-furrow rounding makes each scale group one furrow over a run of tokens; per-token rounding makes it one token's vector.

sparse-coding:
  label: sparse coding
  name: sparse coding (a vector as a few atoms of a large dictionary)
  cat: linalg
  home: papers-lexico
  short: >-
    Describe a vector as a weighted sum of a few vectors ("atoms") picked from a large, fixed dictionary, and store only which atoms and their weights. VQ is the special case of one atom with weight 1; a KLT uses every axis with a weight.

# =============================================================== the plan (Part X)
big-question:
  label: big-picture question
  name: big-picture question (Q1–Q3)
  cat: project
  home: plan-where-we-stand
  short: >-
    An open-ended question the project exists to get closer to: Q1 (what structure does the orchard have, in bits?), Q2 (can a dictionary-and-delta store beat raw storage on the miss path?), Q3 (do picks pile into few stretches?). Too wide to answer with one experiment.

framework-question:
  label: experiment question
  name: experiment question (one scenario, one decision)
  cat: project
  home: plan-principles
  short: >-
    A question asked together with its scenario, its controls and each possible outcome's meaning, all written down before any data.

trace-replay:
  label: trace replay
  name: trace replay (re-running caches on recorded picks)
  cat: systems
  home: plan-queries-and-picks
  short: >-
    Recording which picks a (stand-in) indexer names at every decode step, then re-running the hot cache and the dictionary shelf on that list. It measures miss rates, the δ-miss fraction and dictionary loads without running any kernel.

decision-rule:
  label: decision rule
  name: decision rule
  cat: project
  home: plan-decision-rules
  short: >-
    The table, written before any data, that maps an experiment's readings to what happens next.
