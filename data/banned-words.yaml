# Words the site has retired (checked by `npm run check:words`, scripts/check-words.mjs).
# Each entry: match (a JS regex, applied case-insensitively; write your own \b word boundaries)
#             say   (why, and what to say instead — printed next to every hit).
# The checker skips code blocks and `code spans`, YAML keys and comments, `::: aside source` and
# `::: note literature` blocks, "their word(s)" table rows, and any line ending in <!-- old-words -->.
- match: "\\bmodel\\b"
  say: "the LLM (name it), a probability table, a stand-in LLM — never the bare word"
- match: "\\bchannels?\\b"
  say: "element / elem_id (a position in a head vector), furrow (that position along the token axis), the link (the wire)"
- match: "\\bentry\\b|\\bentries\\b"
  say: "pick (what the indexer names) or cherry (what the receiver asks for)"
- match: "\\bblocks?\\b"
  say: "stretch (a run of token positions) or punnet (the cherries one dictionary serves)"
- match: "\\bKV cache\\b"
  say: "the orchard"
- match: "\\brequests?\\b"
  say: "sequence (one LLM context); 'ask for' / 'a pick' for the indexer's demand"
- match: "\\bthreads?\\b"
  say: "sequence"
- match: "(?<!entropy[ -])\\bcoders?\\b|\\bcodecs?\\b"
  say: "compressor (a concrete compress/decompress pair); 'entropy coder' is allowed as a stage name"
- match: "\\balgorithms?\\b"
  say: "compressor, stage, or the specific name (k-means, Huffman)"
- match: "\\bchunks?\\b|\\bsegments?\\b"
  say: "stretch"
- match: "\\bread budget\\b"
  say: "the leash"
- match: "\\bentry split\\b"
  say: "slice and cherry shape"
- match: "\\bproxy model\\b"
  say: "stand-in LLM"
- match: "\\bdictionary cache\\b"
  say: "dictionary shelf"
- match: "\\bkv-blockdiff\\b"
  say: "kvblockdiff (one spelling)"
